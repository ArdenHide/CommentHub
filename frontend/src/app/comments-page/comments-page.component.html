<div class="comments-page container py-4">
  <header class="mb-4">
    <h1 class="mb-1">Comments</h1>
    <p class="text-muted mb-0">{{ totalCount() }} comments</p>
  </header>

  @if (error()) {
    <div class="alert alert-danger" role="alert">{{ error() }}</div>
  }

  @if (initialLoading()) {
    <p class="text-muted">Loading comments…</p>
  } @else {
    <ul class="list-group list-group-flush">
      @for (comment of comments(); track comment.id) {
        <li class="list-group-item comment-card px-0 py-3">
          <div class="d-flex">
            <app-comment-avatar
              class="flex-shrink-0 me-3"
              [seed]="comment.avatarSeed"
              [authorName]="comment.authorName"
            />
            <div class="flex-grow-1">
              <div class="d-flex justify-content-between align-items-baseline">
                <h6 class="mb-0">{{ comment.authorName }}</h6>
                <small class="text-muted">{{ comment.createdAt | date:'medium' }}</small>
              </div>
              <p class="mb-2 mt-1" [innerHTML]="comment.textHtml"></p>
              <button type="button" class="btn btn-link btn-sm p-0" mdbRipple>
                Reply
              </button>
              <app-comment-replies [node]="comment" />
            </div>
          </div>
        </li>
      }
    </ul>

    @if (hasMore()) {
      <div class="text-center mt-3">
        <button
          type="button"
          class="btn btn-outline-primary"
          mdbRipple
          [disabled]="loading()"
          (click)="loadMore()"
        >
          {{ loading() ? 'Loading…' : 'Load more' }}
        </button>
      </div>
    }
  }
</div>
