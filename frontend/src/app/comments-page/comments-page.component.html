<div class="comments-page container py-4">
  <header class="mb-4">
    <h1 class="mb-1">Comments</h1>
    <p class="text-muted mb-0">{{ comments.length }} comments</p>
  </header>

  <ul class="list-group list-group-flush">
    @for (comment of comments; track comment.id) {
      <li class="list-group-item comment-card px-0 py-3">
        <div class="d-flex">
          <div
            class="avatar-circle flex-shrink-0 me-3"
            [style.background-color]="comment.avatarColor"
          >
            {{ comment.authorInitials }}
          </div>
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between align-items-baseline">
              <h6 class="mb-0">{{ comment.authorName }}</h6>
              <small class="text-muted">{{ comment.createdAt | date:'medium' }}</small>
            </div>
            <p class="mb-2 mt-1">{{ comment.text }}</p>
            <button type="button" class="btn btn-link btn-sm p-0" mdbRipple>
              Reply
            </button>
          </div>
        </div>
      </li>
    }
  </ul>
</div>
