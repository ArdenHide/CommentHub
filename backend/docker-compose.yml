services:
  postgres:
    image: postgres:17-alpine
    container_name: commenthub-postgres
    environment:
      POSTGRES_DB: commenthub
      POSTGRES_USER: commenthub
      POSTGRES_PASSWORD: commenthub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commenthub -d commenthub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Browser-based Postgres viewer/query tool — no desktop client needed.
  # Opens already connected to the `postgres` service above.
  pgweb:
    image: sosedoff/pgweb
    container_name: commenthub-pgweb
    environment:
      DATABASE_URL: postgres://commenthub:commenthub@postgres:5432/commenthub?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: src/CommentHub.Api/Dockerfile
    container_name: commenthub-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CommentHub: "Host=postgres;Port=5432;Database=commenthub;Username=commenthub;Password=commenthub"
      SeedDevData: "false"
      Attachments__RootPath: /data/attachments
    ports:
      - "5203:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - attachments-data:/data/attachments

volumes:
  postgres-data:
  attachments-data:
